name: Regenerate

on:
  schedule:
    - cron: "0 16 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  UV_MANAGED_PYTHON: 1

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: auto
      - name: Regenerate
        run: make regenerate
      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ci-regenerate
          commit-message: "Regenerate"
          title: "Automated regeneration"
          body: "This PR was generated by running `make regenerate`."
          delete-branch: true
